<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#fbfbfa">
  <title>Dotion</title>
  <link rel="stylesheet" href="/styles.css?v=0.3.3">
</head>
<body>
  <div id="login" class="login-screen hidden">
    <form id="loginForm" class="login-card">
      <div class="brand-mark">D</div>
      <h1>Dotion</h1>
      <p>LAAVA Workspace</p>
      <select id="loginUser"></select>
      <button type="submit" class="primary">Belépés</button>
      <div id="loginError" class="form-error"></div>
    </form>
  </div>

  <div id="app" class="app-shell hidden">
    <aside id="sidebar" class="sidebar">
      <div class="workspace-head"><div class="workspace-icon">L</div><strong>LAAVA Workspace</strong><button id="collapseBtn" class="icon-btn desktop-collapse" aria-label="Oldalsáv összecsukása">‹</button><button id="mobileSidebarClose" class="icon-btn mobile-sidebar-close" aria-label="Menü bezárása">×</button></div>
      <button class="nav-item" data-view="search"><span>⌕</span><b>Keresés</b><kbd>⌘K</kbd></button>
      <button class="nav-item active" data-view="home"><span>⌂</span><b>Kezdőlap</b></button>
      <button class="nav-item" data-view="tasks"><span>✓</span><b>Feladatok</b></button>
      <button class="nav-item" data-view="content"><span>▦</span><b>Tartalom</b></button>
      <button class="nav-item" data-view="inbox"><span>↓</span><b>Inbox</b></button>

      <div class="section-label">MÁRKÁK</div>
      <button class="nav-item filter-brand" data-brand="LAAVA"><span class="brand-nav-icon">◆</span><b>LAAVA</b></button>
      <button class="nav-item filter-brand" data-brand="MATÉZZ"><span class="brand-nav-icon">◉</span><b>MATÉZZ</b></button>
      <button class="nav-item filter-brand" data-brand="Matchai"><span class="brand-nav-icon">●</span><b>Matchai</b></button>
      <button class="nav-item filter-brand" data-brand="Közös"><span class="brand-nav-icon">◆</span><b>Közös</b></button>

      <div class="section-label">TERÜLETEK</div>
      <button class="nav-item" data-view="products"><span>□</span><b>Termékek</b></button>
      <button class="nav-item" data-view="notes"><span>≡</span><b>Jegyzetek</b></button>

      <div class="sidebar-spacer"></div>
      <div id="meBox" class="me-box"></div>
    </aside>
    <button id="mobileSidebarBackdrop" class="mobile-sidebar-backdrop" aria-label="Menü bezárása"></button>

    <main class="main">
      <header class="topbar">
        <button id="mobileMenu" class="icon-btn mobile-only">☰</button>
        <div id="breadcrumb" class="breadcrumb">Kezdőlap</div>
        <div class="top-actions"><button id="searchBtn" class="icon-btn">⌕</button><button id="quickTop" class="primary compact">+ Új</button></div>
      </header>
      <section id="contentRoot" class="content-root"></section>
    </main>

    <button id="quickFab" class="fab">+</button>

    <div id="drawerBackdrop" class="backdrop hidden"></div>
    <aside id="drawer" class="drawer hidden"></aside>

    <div id="quickMenu" class="quick-menu hidden">
      <button data-kind="task">✓ Új feladat</button>
      <button data-kind="content">▦ Új tartalom</button>
      <button data-kind="idea">✦ Új tartalomötlet</button>
      <button data-kind="note">≡ Új jegyzet</button>
    </div>

    <div id="modalBackdrop" class="modal-backdrop hidden">
      <div id="modal" class="modal"></div>
    </div>
  </div>

  <script src="/app.js?v=0.3.3"></script>
</body>
</html>
